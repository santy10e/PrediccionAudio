[project]
name = "audio-anomaly-classifier"
version = "2.0.0"
description = "Detección de anomalías acústicas en maquinaria industrial con MFCC + Random Forest y una interfaz Streamlit."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.45",
    "librosa>=0.10",
    "soundfile>=0.12",
    "scikit-learn>=1.3",
    "numpy>=1.24",
    "pandas>=2.0",
    "plotly>=5.20",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools]
packages = ["audio_classifier"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
